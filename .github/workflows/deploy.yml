name: Deploy Portfolio

# Cloudflare Workers owns this deploy now. The previous workflow SSH'd to the VPS
# and ran deploy.sh against a PM2 process that no longer exists, so a push to
# main would have failed on every run.
on:
  push:
    branches: [main]
  # Deploys from the dashboard need a dispatch trigger too.
  workflow_dispatch:

concurrency:
  # A second push while a build is running cancels the older one. Without this,
  # two builds race to write .open-next and the newer commit can lose.
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so
      # they are passed here rather than as Workers secrets -- setting them at
      # runtime would have no effect on the shipped JS.
      #
      # The critical-CSS pass runs as its own step after the OpenNext build, not
      # as part of `npm run build`: CI invokes `opennextjs-cloudflare build`
      # directly, so anything chained onto the npm script alone would be skipped
      # in production. It edits the built HTML in place, so ordering matters.
      - name: Build with OpenNext
        env:
          NEXT_PUBLIC_SITE_URL: https://adityahimaone.space
        run: pnpm exec opennextjs-cloudflare build

      - name: Inline critical CSS
        run: pnpm exec node scripts/inline-critical-css.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Notify Telegram on Failure
        uses: appleboy/telegram-action@v1.0.0
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            🚨 *Portfolio Deploy FAILED (Cloudflare)*
            Branch: `main`
            Commit: `${{ github.sha }}`
            Repository: ${{ github.repository }}
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
